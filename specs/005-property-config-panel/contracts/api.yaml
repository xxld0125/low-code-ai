openapi: 3.0.3
info:
  title: FlowBase 组件属性配置面板 API
  description: |
    FlowBase低代码平台组件属性配置面板的API接口规范。

    提供完整的组件属性配置功能，包括：
    - 组件属性的CRUD操作
    - 属性模板管理
    - 样式预设管理
    - 事件处理器管理
    - 配置历史记录
    - 实时预览支持

    所有API都需要用户认证，遵循Supabase RLS策略进行权限控制。
  version: 1.0.0
  contact:
    name: FlowBase开发团队
    email: dev@flowbase.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.flowbase.com
    description: 生产环境
  - url: https://dev-api.flowbase.com
    description: 开发环境
  - url: http://localhost:3000/api
    description: 本地开发环境

security:
  - BearerAuth: []

tags:
  - name: 组件属性配置
    description: 组件属性的增删改查操作
  - name: 属性模板
    description: 属性模板的管理和使用
  - name: 样式预设
    description: 样式预设的CRUD操作
  - name: 事件处理器
    description: 事件处理器的管理
  - name: 配置历史
    description: 属性配置的历史记录和版本管理

paths:
  # 组件属性配置相关接口
  /properties:
    get:
      tags:
        - 组件属性配置
      summary: 获取组件属性配置列表
      description: |
        获取项目中的组件属性配置列表，支持分页、排序和筛选。

        查询参数：
        - page: 页码（从1开始）
        - limit: 每页数量，默认20，最大100
        - projectId: 项目ID，必需
        - componentId: 组件ID，可选
        - search: 搜索关键词，可选
        - sortBy: 排序字段，默认updated_at
        - sortOrder: 排序方向，asc或desc，默认desc
      operationId: getComponentProperties
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: componentId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, component_type, property_name]
            default: updated_at
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: 成功返回组件属性配置列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      properties:
                        type: array
                        items:
                          $ref: '#/components/schemas/ComponentProperty'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags:
        - 组件属性配置
      summary: 创建组件属性配置
      description: |
        为指定组件创建属性配置。支持批量创建多个属性。

        请求体包含：
        - projectId: 项目ID
        - componentId: 组件ID
        - properties: 属性配置数组
      operationId: createComponentProperties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, componentId, properties]
              properties:
                projectId:
                  type: string
                  format: uuid
                  description: 项目ID
                componentId:
                  type: string
                  format: uuid
                  description: 组件ID
                properties:
                  type: array
                  description: 属性配置数组
                  items:
                    $ref: '#/components/schemas/CreateComponentPropertyRequest'
      responses:
        '201':
          description: 成功创建组件属性配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComponentProperty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 属性配置已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /properties/{propertyId}:
    get:
      tags:
        - 组件属性配置
      summary: 获取单个组件属性配置
      description: 根据属性ID获取详细的属性配置信息
      operationId: getComponentProperty
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 属性配置ID
      responses:
        '200':
          description: 成功返回属性配置信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ComponentProperty'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - 组件属性配置
      summary: 更新组件属性配置
      description: 更新指定的组件属性配置，支持部分更新
      operationId: updateComponentProperty
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                propertyValue:
                  oneOf:
                    - type: string
                    - type: number
                    - type: boolean
                    - type: object
                    - type: array
                  description: 属性值
                validation:
                  $ref: '#/components/schemas/PropertyValidation'
                metadata:
                  type: object
                  description: 属性元数据
      responses:
        '200':
          description: 成功更新属性配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ComponentProperty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - 组件属性配置
      summary: 删除组件属性配置
      description: 删除指定的组件属性配置
      operationId: deleteComponentProperty
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功删除属性配置
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # 批量操作接口
  /properties/batch:
    post:
      tags:
        - 组件属性配置
      summary: 批量操作组件属性
      description: |
        批量创建、更新或删除组件属性配置。支持以下操作：
        - create: 创建新属性
        - update: 更新现有属性
        - delete: 删除属性

        所有操作在单个事务中执行，确保数据一致性。
      operationId: batchOperationProperties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  items:
                    $ref: '#/components/schemas/BatchPropertyOperation'
      responses:
        '200':
          description: 成功执行批量操作
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/BatchOperationResult'
                      failedOperations:
                        type: array
                        items:
                          $ref: '#/components/schemas/BatchOperationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # 属性验证接口
  /properties/validate:
    post:
      tags:
        - 组件属性配置
      summary: 验证组件属性配置
      description: |
        验证组件属性配置的有效性，不实际保存数据。
        支持以下验证类型：
        - schema: 基于属性模式的验证
        - business: 业务逻辑验证
        - dependency: 依赖关系验证
      operationId: validateComponentProperties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, componentId, properties]
              properties:
                projectId:
                  type: string
                  format: uuid
                componentId:
                  type: string
                  format: uuid
                componentType:
                  type: string
                  description: 组件类型
                properties:
                  type: array
                  items:
                    type: object
                    properties:
                      propertyName:
                        type: string
                      propertyValue:
                        description: 属性值，任意类型
                      propertySchema:
                        $ref: '#/components/schemas/PropertySchema'
                validationTypes:
                  type: array
                  items:
                    type: string
                    enum: [schema, business, dependency]
                  default: [schema]
      responses:
        '200':
          description: 验证完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PropertyValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # 属性模板相关接口
  /templates:
    get:
      tags:
        - 属性模板
      summary: 获取属性模板列表
      description: 获取可用的属性模板列表，支持按组件类型筛选
      operationId: getPropertyTemplates
      parameters:
        - name: componentType
          in: query
          schema:
            type: string
          description: 组件类型，可选
        - name: includeSystem
          in: query
          schema:
            type: boolean
            default: true
          description: 是否包含系统模板
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功返回属性模板列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      templates:
                        type: array
                        items:
                          $ref: '#/components/schemas/PropertyTemplate'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /templates/{templateId}:
    get:
      tags:
        - 属性模板
      summary: 获取属性模板详情
      description: 获取指定属性模板的详细信息，包括所有属性定义
      operationId: getPropertyTemplate
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功返回属性模板详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PropertyTemplateDetail'

  # 样式预设相关接口
  /style-presets:
    get:
      tags:
        - 样式预设
      summary: 获取样式预设列表
      description: 获取可用的样式预设列表
      operationId: getStylePresets
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [basic, modern, classic, minimalist, colorful]
          description: 样式分类
        - name: componentType
          in: query
          schema:
            type: string
          description: 适用组件类型
      responses:
        '200':
          description: 成功返回样式预设列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StylePreset'

  # 事件处理器相关接口
  /event-handlers:
    get:
      tags:
        - 事件处理器
      summary: 获取事件处理器列表
      description: 获取组件的事件处理器配置
      operationId: getEventHandlers
      parameters:
        - name: componentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: eventType
          in: query
          schema:
            type: string
            enum: [click, submit, change, focus, blur]
          description: 事件类型
      responses:
        '200':
          description: 成功返回事件处理器列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventHandler'

    post:
      tags:
        - 事件处理器
      summary: 创建事件处理器
      description: 为组件创建事件处理器
      operationId: createEventHandler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventHandlerRequest'
      responses:
        '201':
          description: 成功创建事件处理器
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventHandler'

  # 配置历史相关接口
  /history:
    get:
      tags:
        - 配置历史
      summary: 获取配置历史记录
      description: 获取组件属性配置的历史变更记录
      operationId: getPropertyHistory
      parameters:
        - name: componentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: propertyId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功返回历史记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      history:
                        type: array
                        items:
                          $ref: '#/components/schemas/PropertyHistory'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /history/{historyId}/restore:
    post:
      tags:
        - 配置历史
      summary: 恢复到历史版本
      description: 将组件属性配置恢复到指定的历史版本
      operationId: restorePropertyHistory
      parameters:
        - name: historyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功恢复到历史版本
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComponentProperty'

# 组件定义
components:
  schemas:
    # 基础响应结构
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 操作是否成功
        message:
          type: string
          description: 响应消息
        timestamp:
          type: string
          format: date-time
          description: 响应时间戳

    # 错误响应结构
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 错误代码
            message:
              type: string
              description: 错误消息
            details:
              type: object
              description: 错误详情
        timestamp:
          type: string
          format: date-time
          description: 错误发生时间

    # 分页结构
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: 当前页码
        limit:
          type: integer
          description: 每页数量
        total:
          type: integer
          description: 总记录数
        totalPages:
          type: integer
          description: 总页数
        hasNext:
          type: boolean
          description: 是否有下一页
        hasPrev:
          type: boolean
          description: 是否有上一页

    # 组件属性配置
    ComponentProperty:
      type: object
      required: [id, projectId, componentId, propertyName, propertyValue, propertyType, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 属性配置ID
        projectId:
          type: string
          format: uuid
          description: 项目ID
        componentId:
          type: string
          format: uuid
          description: 组件ID
        propertyName:
          type: string
          description: 属性名称
        propertyValue:
          description: 属性值，支持任意JSON类型
        propertyType:
          type: string
          enum: [string, number, boolean, object, array, color, size, spacing]
          description: 属性数据类型
        propertySchema:
          $ref: '#/components/schemas/PropertySchema'
        validation:
          $ref: '#/components/schemas/PropertyValidation'
        metadata:
          type: object
          description: 属性元数据
          properties:
            category:
              type: string
              description: 属性分类
            group:
              type: string
              description: 属性分组
            order:
              type: integer
              description: 显示顺序
            description:
              type: string
              description: 属性描述
        isRequired:
          type: boolean
          description: 是否必需
        isDefault:
          type: boolean
          description: 是否为默认值
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
        createdBy:
          type: string
          format: uuid
          description: 创建者ID
        updatedBy:
          type: string
          format: uuid
          description: 更新者ID

    # 创建属性配置请求
    CreateComponentPropertyRequest:
      type: object
      required: [propertyName, propertyValue, propertyType]
      properties:
        propertyName:
          type: string
          description: 属性名称
        propertyValue:
          description: 属性值，支持任意JSON类型
        propertyType:
          type: string
          enum: [string, number, boolean, object, array, color, size, spacing]
        propertySchema:
          $ref: '#/components/schemas/PropertySchema'
        validation:
          $ref: '#/components/schemas/PropertyValidation'
        metadata:
          type: object
          description: 属性元数据
        isRequired:
          type: boolean
          default: false

    # 属性模式定义
    PropertySchema:
      type: object
      properties:
        type:
          type: string
          description: 数据类型
        format:
          type: string
          description: 数据格式
        pattern:
          type: string
          description: 正则表达式模式
        minimum:
          type: number
          description: 最小值
        maximum:
          type: number
          description: 最大值
        minLength:
          type: integer
          description: 最小长度
        maxLength:
          type: integer
          description: 最大长度
        enum:
          type: array
          items:
            type: string
          description: 枚举值
        default:
          description: 默认值
        nullable:
          type: boolean
          default: false
          description: 是否允许为空

    # 属性验证规则
    PropertyValidation:
      type: object
      properties:
        required:
          type: boolean
          description: 是否必需
        rules:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [min, max, minLength, maxLength, pattern, custom]
              value:
                description: 验证值
              message:
                type: string
                description: 错误消息
        customValidator:
          type: string
          description: 自定义验证函数名

    # 属性验证结果
    PropertyValidationResult:
      type: object
      properties:
        valid:
          type: boolean
          description: 是否验证通过
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          description: 验证错误列表
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationWarning'
          description: 验证警告列表

    # 验证错误
    ValidationError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 错误代码
        message:
          type: string
          description: 错误消息
        property:
          type: string
          description: 出错的属性名
        value:
          description: 错误的属性值

    # 验证警告
    ValidationWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 警告代码
        message:
          type: string
          description: 警告消息
        property:
          type: string
          description: 警告的属性名
        suggestion:
          type: string
          description: 建议修复方案

    # 批量操作
    BatchPropertyOperation:
      type: object
      required: [operation, type]
      properties:
        operation:
          type: string
          enum: [create, update, delete]
          description: 操作类型
        type:
          type: string
          enum: [property, template, style, event]
          description: 操作对象类型
        data:
          description: 操作数据，根据操作类型不同而不同
        propertyId:
          type: string
          format: uuid
          description: 属性ID（更新和删除时需要）

    # 批量操作结果
    BatchOperationResult:
      type: object
      properties:
        operation:
          type: string
          description: 操作类型
        success:
          type: boolean
          description: 是否成功
        data:
          description: 操作结果数据
        message:
          type: string
          description: 操作消息

    # 批量操作错误
    BatchOperationError:
      type: object
      properties:
        operation:
          type: string
          description: 操作类型
        error:
          type: string
          description: 错误消息
        data:
          description: 操作数据（用于标识失败的操作）

    # 属性模板
    PropertyTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 模板名称
        description:
          type: string
          description: 模板描述
        componentType:
          type: string
          description: 适用组件类型
        isSystem:
          type: boolean
          description: 是否为系统模板
        category:
          type: string
          description: 模板分类
        version:
          type: string
          description: 模板版本
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # 属性模板详情
    PropertyTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/PropertyTemplate'
        - type: object
          properties:
            properties:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/CreateComponentPropertyRequest'
                  - type: object
                    properties:
                      order:
                        type: integer
                        description: 显示顺序
                      group:
                        type: string
                        description: 属性分组

    # 样式预设
    StylePreset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 预设名称
        description:
          type: string
          description: 预设描述
        category:
          type: string
          enum: [basic, modern, classic, minimalist, colorful]
          description: 样式分类
        styles:
          type: object
          description: 样式定义
          properties:
            colors:
              type: object
              description: 颜色配置
            typography:
              type: object
              description: 字体配置
            spacing:
              type: object
              description: 间距配置
            borders:
              type: object
              description: 边框配置
        thumbnail:
          type: string
          description: 预设缩略图URL
        applicableTypes:
          type: array
          items:
            type: string
          description: 适用组件类型
        isDefault:
          type: boolean
          description: 是否为默认预设
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # 事件处理器
    EventHandler:
      type: object
      properties:
        id:
          type: string
          format: uuid
        componentId:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [click, submit, change, focus, blur]
          description: 事件类型
        actionType:
          type: string
          enum: [navigate, submit, api_call, custom_logic, show_message]
          description: 动作类型
        actionConfig:
          type: object
          description: 动作配置
        isActive:
          type: boolean
          description: 是否启用
        order:
          type: integer
          description: 执行顺序
        description:
          type: string
          description: 事件描述
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # 创建事件处理器请求
    CreateEventHandlerRequest:
      type: object
      required: [componentId, eventType, actionType]
      properties:
        componentId:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [click, submit, change, focus, blur]
        actionType:
          type: string
          enum: [navigate, submit, api_call, custom_logic, show_message]
        actionConfig:
          type: object
          description: 动作配置
        isActive:
          type: boolean
          default: true
        order:
          type: integer
          default: 0
        description:
          type: string

    # 配置历史
    PropertyHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        componentId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        operation:
          type: string
          enum: [create, update, delete]
          description: 操作类型
        oldValue:
          description: 变更前的值
        newValue:
          description: 变更后的值
        changeSummary:
          type: string
          description: 变更摘要
        userId:
          type: string
          format: uuid
          description: 操作用户ID
        changeReason:
          type: string
          description: 变更原因
        createdAt:
          type: string
          format: date-time

  # 响应定义
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: 未授权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # 安全方案
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT Token